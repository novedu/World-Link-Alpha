name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            sidepanel/package-lock.json

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Install sidepanel deps
        run: npm --prefix sidepanel ci

      - name: Run verify pipeline
        run: npm run verify
