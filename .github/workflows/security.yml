name: Security Checks

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            sidepanel/package-lock.json

      - name: Install backend deps
        run: npm --prefix backend ci

      - name: Install sidepanel deps
        run: npm --prefix sidepanel ci

      - name: Validate env security baseline
        run: npm run security:env

      - name: Audit backend dependencies
        run: npm --prefix backend audit --audit-level=high

      - name: Audit sidepanel dependencies
        run: npm --prefix sidepanel audit --audit-level=high
