name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sidepanel/package-lock.json

      - name: Install dependencies
        run: npm --prefix sidepanel ci

      - name: Lint
        run: npm --prefix sidepanel run lint

      - name: Type check
        run: npm --prefix sidepanel run typecheck

      - name: Test with coverage
        run: npm --prefix sidepanel test -- --coverage

      - name: Build
        run: npm --prefix sidepanel run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm --prefix backend ci

      - name: Lint
        run: npm --prefix backend run lint

      - name: Type check
        run: npm --prefix backend run typecheck

      - name: Test
        run: RUN_SOCKET_E2E=1 npm --prefix backend test

      - name: Build
        run: npm --prefix backend run build

  deploy:
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy notification
        run: echo "Deployment would be triggered here"
